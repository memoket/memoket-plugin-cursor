<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">How a Memoket request runs in Cursor</title>
  <desc id="desc">Ask in Cursor, authorize access, retrieve the source, and answer with context.</desc>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <g transform="translate(20 20)">
      <rect width="330" height="150" rx="14" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>
      <rect x="22" y="20" width="46" height="32" rx="7" fill="#24292F"/>
      <text x="45" y="42" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">01</text>
      <text x="22" y="105" fill="#202124" font-size="30" font-weight="700">Ask in Cursor</text>
    </g>

    <path d="M365 95H395" stroke="#8C959F" stroke-width="5" stroke-linecap="round"/>
    <path d="M385 84L397 95 385 106" fill="none" stroke="#8C959F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(410 20)">
      <rect width="330" height="150" rx="14" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>
      <rect x="22" y="20" width="46" height="32" rx="7" fill="#24292F"/>
      <text x="45" y="42" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">02</text>
      <text x="22" y="105" fill="#202124" font-size="30" font-weight="700">Authorize access</text>
    </g>

    <path d="M575 187V217" stroke="#8C959F" stroke-width="5" stroke-linecap="round"/>
    <path d="M564 207L575 219 586 207" fill="none" stroke="#8C959F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(410 250)">
      <rect width="330" height="150" rx="14" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>
      <rect x="22" y="20" width="46" height="32" rx="7" fill="#24292F"/>
      <text x="45" y="42" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">03</text>
      <text x="22" y="105" fill="#202124" font-size="30" font-weight="700">Retrieve source</text>
    </g>

    <path d="M395 325H365" stroke="#8C959F" stroke-width="5" stroke-linecap="round"/>
    <path d="M375 314L363 325 375 336" fill="none" stroke="#8C959F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(20 250)">
      <rect width="330" height="150" rx="14" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2"/>
      <rect x="22" y="20" width="46" height="32" rx="7" fill="#24292F"/>
      <text x="45" y="42" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">04</text>
      <text x="22" y="105" fill="#202124" font-size="30" font-weight="700">Answer in context</text>
    </g>
  </g>
</svg>
