<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 430" role="img" aria-labelledby="title desc">
  <title id="title">How Memoket for Cursor works</title>
  <desc id="desc">Ask Cursor about a conversation, authorize Memoket, locate the right recording, retrieve only the needed source, and answer with recording context.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="9" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faint"><feFuncA type="table" tableValues="0 0.035"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F2A637"/>
    </marker>
    <style>
      .label{font:700 23px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.7px;fill:#232B3A}
      .copy{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596170}
      .num{font:700 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#fff}
      .box{fill:#FFFDF5;stroke:#232B3A;stroke-width:3}
      .wire{fill:none;stroke:#F2A637;stroke-width:5;stroke-linecap:round;stroke-dasharray:9 12;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1660" height="430" rx="34" fill="#F5F0E3" filter="url(#paper)"/>
  <path d="M88 76 C310 36 520 102 746 67 S1204 40 1565 78" fill="none" stroke="#F2A637" stroke-width="3" opacity=".65"/>

  <g transform="translate(55 135)">
    <rect class="box" width="260" height="170" rx="24"/>
    <circle cx="35" cy="35" r="18" fill="#232B3A"/><text class="num" x="30" y="41">1</text>
    <text class="label" x="28" y="86">ASK CURSOR</text>
    <text class="copy" x="28" y="121">“What did we decide</text><text class="copy" x="28" y="147">in yesterday’s sync?”</text>
  </g>
  <path class="wire" d="M326 220 C348 188 374 188 397 220"/>

  <g transform="translate(410 135)">
    <rect class="box" width="260" height="170" rx="24"/>
    <circle cx="35" cy="35" r="18" fill="#7356B1"/><text class="num" x="30" y="41">2</text>
    <text class="label" x="28" y="86">AUTHORIZE</text>
    <text class="copy" x="28" y="121">Memoket OAuth keeps</text><text class="copy" x="28" y="147">the account boundary.</text>
  </g>
  <path class="wire" d="M681 220 C703 188 729 188 752 220"/>

  <g transform="translate(765 135)">
    <rect class="box" width="260" height="170" rx="24"/>
    <circle cx="35" cy="35" r="18" fill="#D65D53"/><text class="num" x="30" y="41">3</text>
    <text class="label" x="28" y="86">FIND SOURCE</text>
    <text class="copy" x="28" y="121">Search or browse, then</text><text class="copy" x="28" y="147">confirm the recording.</text>
  </g>
  <path class="wire" d="M1036 220 C1058 188 1084 188 1107 220"/>

  <g transform="translate(1120 135)">
    <rect class="box" width="260" height="170" rx="24"/>
    <circle cx="35" cy="35" r="18" fill="#3D7E71"/><text class="num" x="30" y="41">4</text>
    <text class="label" x="28" y="86">RETRIEVE</text>
    <text class="copy" x="28" y="121">Fetch the smallest useful</text><text class="copy" x="28" y="147">summary or transcript.</text>
  </g>
  <path class="wire" d="M1391 220 C1413 188 1439 188 1462 220"/>

  <g transform="translate(1475 135)">
    <rect class="box" width="130" height="170" rx="24"/>
    <circle cx="35" cy="35" r="18" fill="#356F9A"/><text class="num" x="30" y="41">5</text>
    <text class="label" x="24" y="86">ANSWER</text>
    <text class="copy" x="24" y="121">With source</text><text class="copy" x="24" y="147">context.</text>
  </g>
  <path d="M87 350 C354 396 593 328 840 365 S1323 397 1570 348" fill="none" stroke="#F2A637" stroke-width="3" opacity=".65"/>
</svg>
